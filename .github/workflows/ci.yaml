name: CI

on:
    push:
        branches: [ main, dev ]


jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set image tag
              id: tag
              run: |
                if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                  echo "prefix=prod" >> $GITHUB_OUTPUT
                else
                  echo "prefix=dev" >> $GITHUB_OUTPUT
                fi
                echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 18
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
              env:
                CI: true
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/weather-frontend:${{ steps.tag.outputs.prefix }}-${{ steps.tag.outputs.sha }}

            - name: Update image tag in helm-infra repo
              if: github.ref == 'refs/heads/main'
              run: |
                git clone https://x-access-token:${{ secrets.HELM_INFRA_TOKEN }}@github.com/itamardavideliyahu-beep/weather-helm-infra.git
                cd weather-helm-infra
                sed -i "s/^  tag:.*/  tag: \"${{ steps.tag.outputs.prefix }}-${{ steps.tag.outputs.sha }}\"/" weather-helm-infra/charts/weather-frontend/values.yaml
                git config user.email "ci-bot@github.com"
                git config user.name "CI Bot"
                git add weather-helm-infra/charts/weather-frontend/values.yaml
                git commit -m "ci: update weather-frontend image tag to ${{ steps.tag.outputs.prefix }}-${{ steps.tag.outputs.sha }}"
                git push